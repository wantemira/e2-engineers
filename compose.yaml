name: ai-buddy

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      BUDDY_MODE: ${BUDDY_MODE:-demo}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-45s}
    volumes:
      - state:/data
      - ./teams:/app/teams:ro
      - ./skills:/app/skills:ro
      - ./mocks:/app/mocks:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 2s
      timeout: 2s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${BUDDY_PORT:-5173}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 2s
      timeout: 2s
      retries: 15

  training:
    profiles: [training]
    build:
      context: ./training/orders
      target: runtime
    ports:
      - "127.0.0.1:${BUDDY_TRAINING_PORT:-8081}:8081"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 2s
      timeout: 2s
      retries: 15

  training-tests:
    profiles: [training]
    build:
      context: ./training/orders
      target: tests
    network_mode: none

volumes:
  state:
